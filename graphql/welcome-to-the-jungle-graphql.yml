capabilities_absent_from_rest:
- countJobs and jobExists — cheap existence and count checks with no REST equivalent.
- salaryBenchmark — salary benchmarking, with a FiguresLevel enum (JUNIOR / INTERMEDIATE / SENIOR / STAFF / TEAM_LEAD / HEAD_OF / VP / C_LEVEL); nothing comparable is documented in REST.
- 'apecIntegration and linkedinIntegration, plus eight mutations that create, update, enable and disable them — first-class job-distribution integrations (APEC, LinkedIn) that the REST API does not expose at all.'
- policies and the ~20 *Policies types — a per-object permission model an agent can read before attempting a write. There is no REST analogue.
- applicationFields, jobRecruiters, jobStages, jobReviewCriteria, websiteOrganizations, organizationStages — ATS configuration surfaces absent from REST.
capabilities_absent_from_graphql:
- Candidate emails, candidate documents and candidate comments — the REST candidates surface writes all three; GraphQL exposes candidate/candidates as reads only.
- Analytics moves (GET /external/moves).
- WTTJ media articles (GET /external/cms/articles/all).
- Employer-branding images, videos, tools, sectors and the careers-site embed payload.
- Department and office creation/update — GraphQL reads them; only REST writes them.
caveats:
- 'Undocumented and unversioned in public. The developer portal never mentions this endpoint, so there is
  no published stability, deprecation or support commitment for it. Treat it as an internal API that is
