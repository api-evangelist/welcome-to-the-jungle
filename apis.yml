apis:
- aid: welcome-to-the-jungle:welcome-to-the-jungle-solutions-api
  name: Welcome to the Jungle Solutions API
  description: REST API over Welcome to the Jungle Solutions recruiting and employer-branding data. Bearer-token
    (OAuth access token) authentication with a published scope model, JSON request and response bodies,
    page/per_page pagination and an X-Total count header. Covers the Jobs API (jobs, job dependencies,
    departments, offices), the Candidates API (candidates, comments, emails, documents, current user),
    the Employer Branding API (organizations, images, videos, embed, tools, sectors), the Analytics API
    (moves) and the Media API (WTTJ articles). Several endpoints — list all jobs, list organizations,
    WTTJ articles — require a dedicated partnership.
