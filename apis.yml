aid: welcome-to-the-jungle
name: Welcome to the Jungle
description: Welcome to the Jungle is a Paris-headquartered employer-branding and hiring platform. Its
  Welcome Hiring Suite bundles Welcome Employer Brand company showcases, Welcome ATS (historically shipped
  as Welcome Kit), Welcome Job Matching and Welcome Sourcing, alongside the welcometothejungle.com job
  board and media property. The company publishes the Welcome to the Jungle Solutions API — a token-gated
  REST API over jobs, departments, offices, candidates, candidate emails, documents, comments, employer-branding
  organizations, images, videos, analytics moves and WTTJ media articles — documented at developers.welcomekit.co
  and served from www.welcomekit.co/api/v1/external.
