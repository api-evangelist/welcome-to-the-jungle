- aid: welcome-to-the-jungle:welcome-to-the-jungle-welcomekit-graphql
  name: Welcome Kit GraphQL API
  description: Undocumented first-party GraphQL API for the Welcome Kit / Welcome ATS platform, live at
    api.welcomekit.co/api/v1/graphql. Anonymous introspection is enabled and returned the complete schema
    (95 types, 36 queries, 11 mutations) on 2026-09-04, while every data field is authorization-gated.
    It is the only complete machine-readable contract Welcome to the Jungle publishes, and it exposes
    capabilities the documented REST API does not — job counts and existence checks, salary benchmarking,
    APEC and LinkedIn job-distribution integrations, and a per-object policies/permission model. Not described
    on the developer portal, so it carries no published stability or support commitment.
  humanURL: https://developers.welcomekit.co/
