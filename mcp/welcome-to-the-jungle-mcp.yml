graphql_note: 'A first-party GraphQL API also exists at https://api.welcomekit.co/api/v1/graphql with a
  fully introspectable schema (see graphql/welcome-to-the-jungle-graphql.yml). It is the better foundation
  for a real MCP server than the REST docs, because its typed inputs give every tool a genuine inputSchema
  — which the REST surface cannot, having no OpenAPI. The 17 GraphQL-only capabilities and 15 REST-only
  operations are enumerated in mcp/welcome-to-the-jungle-tool-crosswalk.yml.'
