agent_cautions:
- 'Ten of these candidate tools mutate, and only update_job_status has a reversal. No idempotency mechanism exists, so a retried create_candidate, create_comment or create_candidate_email produces a duplicate.'
- 'Eleven tools touch candidate personal data under GDPR. There is no published erasure or anonymisation endpoint, so an agent cannot undo a personal-data write through the API.'
- 'No rate limits are published and no 429 is documented; an agent has no backoff signal.'
