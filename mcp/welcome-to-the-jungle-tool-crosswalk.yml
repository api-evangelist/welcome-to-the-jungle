summary: 'Welcome to the Jungle runs TWO overlapping-but-non-identical projections of one recruiting data
  core: a documented REST API at www.welcomekit.co/api/v1/external and an undocumented GraphQL API at
  api.welcomekit.co/api/v1/graphql. Neither is a superset. This crosswalk records the union so the
  divergence is data rather than something a reader has to rediscover. Binding is by resource name and
  semantics, NOT by operationId — the provider publishes no OpenAPI document, so no operationId exists to
  bind to and every confidence value below reflects that.'
