    evidence: 'The API returns bare vendor JSON with no JSON-LD, @context or @type. The consumer job pages
      on www.welcomekit.co / welcometothejungle.com render client-side and served no application/ld+json
      block when fetched 2026-09-04, so no structured-data signature could be observed either.'
  - standard: SCIM
    result: not-declared
    evidence: Not applicable to this surface — the API carries candidates and job offers, not identity provisioning.
  note: 'Recruiting has a nominal interoperability standard (HR Open Standards) with, per the rubric''s
    own 2026-08-17 census, zero detectable adoption across the catalog. Welcome to the Jungle declares
