- id: pagination
  conforms: true
  evidence: https://developers.welcomekit.co/jobs-api/jobs/list-jobs
  note: 'Page-number pagination via page and per_page query parameters, with the total count exposed in
    an X-Total response header (documented at https://developers.welcomekit.co/faq). No Link header and
    no cursor.'
- id: idempotency
  conforms: false
  evidence: 'The complete documentation set contains no idempotency mechanism; see conventions/welcome-to-the-jungle-conventions.yml (coverage: none).'
- id: rest
  conforms: true
  partial: true
  evidence: https://developers.welcomekit.co/
  note: 'Resource-oriented URI design with GET/POST/PUT over JSON and a documented 405 for wrong methods.
    No DELETE anywhere on the surface, no hypermedia, no conditional requests (ETag / If-Match).'
- id: cors
  conforms: true
  evidence: 'Observed live 2026-09-04 on https://www.welcomekit.co/api/v1/external/jobs — access-control-allow-origin: *, access-control-allow-methods: GET, POST, PUT, DELETE, OPTIONS, access-control-allow-headers including Authorization.'
- id: gdpr
  conforms: true
  evidence: https://solutions.welcometothejungle.com/en/privacy-policy
  note: 'The privacy policy states it is drawn up in compliance with GDPR (EU 2016/679), UK GDPR and the
    UK Data Protection Act 2018; names an appointed Data Protection Officer reachable at
    privacy@welcometothejungle.com; identifies CNIL (France) and the ICO (UK) as supervisory authorities;
