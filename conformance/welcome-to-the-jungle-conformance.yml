api: Welcome to the Jungle Solutions API
summary: 'Standards posture of the Welcome to the Jungle Solutions API, asserted only where the published
  documentation or a live response actually carries the signature. The documented REST API borrows OAuth 2.0 vocabulary
  without implementing the protocol''s discovery or grant surface, uses a vendor error envelope rather
  than RFC 9457, and declares no interoperability standard for the recruiting market. The one substantial
  published compliance program is data protection: a GDPR / UK GDPR / DPA 2018 privacy program with a
  named Data Protection Officer, identified supervisory authorities and Standard Contractual Clauses for
  transfers.'
conformance:
- id: oauth2
  conforms: false
  partial: true
  evidence: https://developers.welcomekit.co/authentication
  note: 'Uses OAuth 2.0 bearer-token transport and the OAuth scope model (citing draft-ietf-oauth-v2-31
    §3.3), but publishes no authorization endpoint, no token endpoint, no grant type and no refresh flow.
    Tokens are issued administratively through a help form. This is OAuth vocabulary over an out-of-band
    credential, not an OAuth 2.0 authorization server.'
- id: rfc8414-oauth-metadata
  conforms: false
  evidence: 'Probed 2026-09-04: /.well-known/oauth-authorization-server returns 404 on www.welcomekit.co, api.welcomekit.co and developers.welcomekit.co.'
- id: oidc
  conforms: false
  evidence: 'Probed 2026-09-04: /.well-known/openid-configuration returns 404 on every Welcome to the Jungle host.'
- id: rfc9457
  conforms: false
  evidence: https://developers.welcomekit.co/errors-and-status
  note: 'Errors are a two-field vendor envelope {error, error_description} served as application/json.
